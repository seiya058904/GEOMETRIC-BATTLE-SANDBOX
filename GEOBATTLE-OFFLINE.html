/* V2: keep the stage dominant; controls frame the battlefield instead of competing with it. */
:root{
  --compact-layout:0;--modal-inspector:0;
  --bg:#10191d;--surface:#172328;--surface-hi:#223238;--text:#f0f2ed;--muted:#a6b5b6;
  --line:#314249;--red:#ff705d;--blue:#59b7fa;--accent:#d3ee89;--radius:5px;
  font-family:"Segoe UI","Microsoft YaHei","PingFang SC",sans-serif;
  font-size:15px;accent-color:var(--accent);caret-color:var(--accent)
}
::selection{background:#d3ee8940;color:var(--text)}
button,input,select{font-size:14px}
button{min-height:40px;line-height:1.4}
input,select{min-height:42px;font-size:14px;border-radius:4px}
button:focus-visible,input:focus-visible,select:focus-visible,a:focus-visible,summary:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
button:disabled{opacity:.48}
#app{grid-template-rows:68px minmax(0,1fr) 74px}
.topbar{padding:0 22px;gap:20px;background:#111d21}
.brand{gap:12px}
.brand>span{font-size:18px;letter-spacing:.12em}
.brand small{font-size:10px;letter-spacing:.08em;color:#a6b5b6}
.scoreboard{gap:14px}
.team-counter{display:flex;align-items:center;min-width:106px;height:44px;gap:8px;padding:4px 10px;background:transparent;color:var(--text);cursor:default}
.team-counter:hover{background:transparent!important}
.team-counter i{width:9px;height:9px}
.team-counter.blue i{border-radius:2px}
.team-counter span{font-size:12px;color:var(--muted)}
.team-counter strong{font-size:23px;min-width:28px}
.team-counter.red strong{color:var(--red)}
.team-counter.blue strong{color:var(--blue)}
.team-counter.red,.team-counter.blue{border-color:transparent}
.versus{font-size:11px;letter-spacing:.12em;color:#84979b}
.top-actions{gap:8px}
.top-actions .icon-button{width:42px;height:42px}
.top-actions .utility-action{min-height:42px;padding:8px 13px;font-size:13px}
.phase-label{font-size:12px;color:#bdc9c8}
.primary{font-size:14px;font-weight:700;padding:11px 18px;border-radius:4px}
.start-button{min-width:154px;height:46px;margin-left:5px}
.workspace,.inspector-hidden .workspace{grid-template-columns:clamp(248px,22vw,304px) minmax(0,1fr)}
.panel{background:#172328}
.catalog{border-right:1px solid var(--line)}
.panel-heading{padding:19px 18px 12px;min-height:70px;gap:12px}
.panel-heading h2{font-size:17px;letter-spacing:0;font-weight:650}
.panel-subtitle{display:block;color:var(--muted);font-size:12px;line-height:1.55;margin-top:3px}
.search-field{height:44px;margin:0 14px 13px;padding:0 11px;border-radius:4px;background:#111d21}
.search-field input{font-size:14px;padding:6px}
.search-field .icon{width:18px;height:18px}
.search-field kbd{font-size:11px}
.category-tabs{grid-template-columns:repeat(3,minmax(0,1fr));gap:5px;padding:0 14px 13px}
.category-tabs button{min-height:38px;padding:6px 4px;font-size:12px;color:#a9b8b9;border-radius:4px}
.category-tabs button.active{color:var(--text);background:#293a3f;border-color:#657a7e}
.catalog-list{scrollbar-color:#51646a transparent}
.unit-card{grid-template-columns:44px minmax(0,1fr) auto;gap:11px;min-height:72px;padding:9px 13px;border-radius:0;border-left:0;border-bottom:1px solid #2b3c42}
.unit-card:hover:not(:disabled){background:#202f34}
.unit-card.selected{background:#263438;border-color:#39494d;box-shadow:inset 0 0 0 1px #65766b}
.unit-card canvas{width:42px;height:42px}
.unit-card .unit-copy{min-width:0;display:block}
.unit-card .unit-name{display:block;font-size:14px;font-weight:600;color:#f0f2ed;margin:0 0 3px;line-height:1.35}
.unit-card .unit-role{display:-webkit-box;-webkit-box-orient:vertical;-webkit-line-clamp:2;overflow:hidden;font-size:11px;line-height:1.45;color:#a6b5b6}
.unit-card .cost{align-self:start;padding-top:3px;font-size:11px;color:#bcc7c1}
.unit-card .cost::after{content:'参考';font-size:9px;color:#8c9a96;margin-left:3px}
.catalog-foot{height:auto;min-height:52px;padding:10px 16px;gap:9px;font-size:11px;line-height:1.55;color:#a6b5b6}
.catalog-foot .small-dot{width:7px;height:7px;flex:none}
.empty-search{display:flex;flex-direction:column;gap:6px;padding:26px 18px;font-size:13px;line-height:1.6}
.empty-search strong{color:var(--text);font-size:14px}
.arena{background:#111c20}
#battlefield{touch-action:none}
.arena-top{top:14px;left:17px;right:17px;align-items:center}
.arena-label{font-size:12px;color:#b3c0c0;padding:8px 11px;background:#142126eF;border:1px solid #33464c;border-radius:4px}
.arena-label i{width:7px;height:7px}
.arena-time{font-size:13px}
.arena-button{min-height:42px;padding:8px 12px;font-size:13px;background:#17262b;border-color:#3a4b51;border-radius:4px}
.arena-top-actions .icon{width:17px;height:17px}
.playback{top:71px;z-index:3;padding:4px;gap:2px;background:#17262b;border-radius:4px}
.playback>span{padding:0 8px;font-size:12px}
.playback button{min-width:43px;min-height:38px;font-size:12px}
.playback button.active{background:#34423a;color:var(--accent)}
.camera-controls{right:17px;bottom:49px;gap:3px;padding:4px;border-radius:4px;background:#152329f2}
.camera-controls button{width:38px;height:38px}
.camera-controls span{font-size:12px;min-width:42px}
.arena-bottom{left:17px;right:17px;bottom:14px;font-size:11px;color:#a0b0b2}
.arena-bottom #load-warning{color:#f1d38b}
.mobile-launchers{display:none}
.inspector{display:none;position:fixed;top:142px;right:18px;bottom:89px;width:min(370px,calc(100vw - 36px));z-index:36;border:1px solid #516168;border-radius:6px;box-shadow:0 14px 36px #02090d9c}
#app:not(.inspector-hidden) .inspector,.inspector.open{display:flex!important}
.inspector .panel-heading{min-height:68px;padding:15px 18px;border-bottom:1px solid var(--line)}
.inspector .panel-heading .icon-button{width:40px;height:40px;padding:9px}
.inspector-content{padding:15px 18px 20px;scrollbar-color:#51646a transparent}
.unit-hero{display:flex;align-items:center;gap:13px;text-align:left;padding:4px 0 12px;border-bottom:0}
.unit-hero canvas{width:68px;height:68px;margin:0}
.unit-hero h3{font-size:22px;font-weight:650;letter-spacing:0}
.unit-hero p{font-size:12px;color:var(--muted);margin-top:4px}
.unit-hero [data-selected-team=red]{color:var(--red)}
.unit-hero [data-selected-team=blue]{color:var(--blue)}
.description{padding:6px 0 12px;font-size:13px;line-height:1.65;color:#c2cdca}
.description strong{font-size:13px;margin-bottom:4px}
.stat-rows{grid-template-columns:repeat(2,minmax(0,1fr));gap:0 18px;padding:4px 0 10px}
.stat-rows>div{padding:9px 0;font-size:13px}
.stat-rows span{font-size:12px;color:#a6b5b6}
.stat-rows b{font-weight:600}
.unit-overview>.primary{margin-top:12px;min-height:48px}
.deployment-hint{font-size:12px;line-height:1.6;color:#b9c7bf;margin-top:9px}
.inspector-group{margin-top:16px;padding-top:13px;border-top:1px solid var(--line)}
.advanced-group>summary,.help-advanced>summary,.result-details>summary{cursor:pointer;min-height:42px;display:flex;align-items:center;justify-content:space-between;gap:12px;color:#e2e8df;font-size:13px;font-weight:600;list-style:none}
.advanced-group>summary::-webkit-details-marker,.help-advanced>summary::-webkit-details-marker{display:none}
.advanced-group>summary::after,.help-advanced>summary::after{content:'+';font-size:18px;color:#b8c98e}
.advanced-group[open]>summary::after,.help-advanced[open]>summary::after{content:'−'}
.advanced-content{padding-top:10px}
.advanced-content .field-row{font-size:13px;color:#c1cdca;margin:12px 0}
.advanced-content input,.advanced-content select{min-width:108px}
.selection-actions{grid-template-columns:repeat(2,minmax(0,1fr));gap:7px}
.selection-quick{margin:0 0 14px;padding:12px;border:1px solid #53665d;background:#202c2a;border-radius:4px}
.selection-quick>strong{display:block;margin-bottom:8px;font-size:13px;color:#e6eddc}
.selection-quick>div{display:flex;flex-wrap:wrap;gap:6px}
.selection-quick button{min-height:42px;padding:7px 10px;border-color:#53665d;font-size:12px}
.selection-actions button{min-height:42px;padding:8px 9px;font-size:12px;border-color:var(--line);border-radius:4px}
.selection-actions .icon{width:17px;height:17px}
.team-actions{margin-top:11px;padding-top:11px;border-top:1px solid #2d3e44}
.side-note{font-size:11px;line-height:1.65;color:#9aabad;margin-top:8px}
.form-inline{align-items:center;gap:9px}
.form-inline .side-note{flex:1;margin:0}
.bottom-bar{min-height:74px;padding:0 17px;gap:16px;background:#111d21;border-top:1px solid #34464c}
.scene-actions{gap:4px}
.scene-actions>button{min-height:44px}
.scene-actions>.quiet{min-height:44px;margin:0;padding:8px 12px;font-size:12px}
.scene-actions>.icon-button,.bottom-info .icon-button{width:44px;height:44px}
.deployment-tools{gap:6px;padding:0;border:0;border-radius:0}
.tool-button{min-width:108px;min-height:48px;padding:8px 14px;gap:9px;border:1px solid #34474d;border-radius:4px;color:#bdc9c8;font-size:13px}
.tool-button .icon{width:19px;height:19px}
.tool-button>span{font-size:13px}
.tool-button.active{color:var(--text);background:#2a393d;border-color:#64776f;box-shadow:inset 0 0 0 1px #63766d}
.tool-button:focus-visible{outline-offset:2px}
.bottom-info{gap:12px;font-size:12px}
.bottom-info #formation-count{font-variant-numeric:tabular-nums;color:#dae1da}
.safe-label{font-size:11px;color:#b8c8ad;padding-left:12px}
.inspector-hidden .workspace{grid-template-columns:clamp(248px,22vw,304px) minmax(0,1fr)}
.health-track{height:7px;margin:14px 0 8px}
.battle-team-row{font-size:13px}
.battle-team-row strong{font-size:25px}
.battle-side-hint{margin:12px 0;color:#c3ceca;font-size:13px;line-height:1.7}
.mini-meter{height:7px;margin:12px 0}
.unit-live-stats{font-size:13px;line-height:1.6}
.unit-live-stats>div{padding:8px 0}
.unit-live-stats b{font-size:13px}
.battle-team-row.red{color:var(--red)}
.battle-team-row.blue{color:var(--blue)}
.drawer-backdrop{background:#061217aa}
#toast{font-size:13px;max-width:min(600px,calc(100vw - 28px));z-index:80}
dialog{border-radius:6px;border-color:#4b5e64}
dialog .dialog-head{padding:18px 22px 14px}
dialog h2{font-size:19px}
dialog .dialog-body{font-size:14px}
dialog p{font-size:13px;line-height:1.75;color:#b9c6c4}
dialog .dialog-foot button{min-height:44px}
.recovery-banner{padding:14px;margin:0 0 16px;border:1px solid #ad955c;background:#302c21;border-radius:4px}
.recovery-banner strong{font-size:13px;color:#f0d797}
.recovery-banner p{margin:6px 0 10px;font-size:12px}
.recovery-banner button{min-height:44px}
.help-rule{display:grid;grid-template-columns:82px 1fr;gap:12px;align-items:start;padding:12px 0;border-bottom:1px solid var(--line);font-size:13px;line-height:1.65;color:#d0d9d5}
.help-action{color:#d8e4c6;font-weight:650}
.help-advanced{margin-top:12px;padding-top:7px;border-top:1px solid var(--line)}
.help-grid{gap:9px 16px}
.help-grid>div{font-size:12px;color:#c0ccca}
.help-grid kbd{min-width:53px;font-size:11px}
.help-footer{padding-top:14px;border-top:1px solid var(--line);margin-top:14px}
.result-hero{padding:8px 0 17px}
.result-hero h3{font-size:30px;letter-spacing:.02em}
.result-time{font-variant-numeric:tabular-nums}
.result-teams{gap:24px}
.result-team>h3{font-size:14px;padding-bottom:10px}
.result-team>div{font-size:12px;line-height:2.3}
.result-mvp{padding:15px;gap:15px;border-radius:4px}
.result-mvp span{font-size:11px}
.result-mvp strong{font-size:13px}
.result-table{font-size:12px}
.result-table td,.result-table th{padding:9px 7px}
.result-details{margin-top:15px}
.result-details>summary{justify-content:flex-start}
.result-foot{gap:8px}
.result-foot button{min-height:46px}
.control-locked .catalog{opacity:1}
.control-locked .unit-card{cursor:default}
.control-locked .deployment-tools{opacity:.72}

@media(max-width:1100px){
  .topbar{padding:0 14px;gap:10px}
  .brand small{display:none}
  .brand>span{font-size:16px}
  .scoreboard{gap:6px}
  .team-counter{min-width:76px;padding:4px 6px;gap:5px}
  .team-counter span{font-size:11px}
  .team-counter strong{font-size:20px;min-width:22px}
  .top-actions{gap:4px}
